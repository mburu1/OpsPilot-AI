---
name: Feature Request
description: Suggest an improvement or a new feature for OpsPilot AI
title: "[FEATURE]: "
labels: [ "enhancement", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Please help us understand the value of this feature.
  - type: textarea
    id: problem
    attributes:
      label: The Problem
      description: What problem are you trying to solve?
      placeholder: I am unable to... because...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see.
      placeholder: I suggest adding a... that allows...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought of other ways to solve this?
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Anything else we should know?
    validations:
      required: false
