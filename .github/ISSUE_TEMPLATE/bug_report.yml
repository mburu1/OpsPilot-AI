---
name: Bug Report
description: Report a bug in OpsPilot AI
title: "[BUG]: "
labels: [ "bug", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of OpsPilot AI are you using? (e.g. v1.0.0)
      placeholder: v1.0.0
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Which environment are you using? (OS, Browser, Python version, etc.)
      placeholder: Ubuntu 22.04, Chrome 120, Python 3.12
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error '....'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: Paste any error logs or upload screenshots.
    validations:
      required: false
