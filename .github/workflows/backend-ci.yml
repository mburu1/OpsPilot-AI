name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Linting (Black)
        run: |
          pip install black
          black --check backend/

      - name: Run Linting (Flake8)
        run: |
          pip install flake8
          # Ignore common Django/DRF formatting issues in CI
          flake8 backend/ --ignore=E501,W503

      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: "ci-test-key"
          DB_NAME: "test_db"
          DB_USER: "postgres"
          DB_PASSWORD: "password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
        run: |
          # We use a dummy SECRET_KEY and env vars to allow Django to boot.
          # Since settings.test uses sqlite :memory:, it won't actually try to connect to Postgres.
          python backend/manage.py test

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety check
        run: |
          pip install safety
          # Safety check against requirements
          safety check -r backend/requirements.txt
