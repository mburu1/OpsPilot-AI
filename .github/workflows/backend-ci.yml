name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install .

      - name: Run Linting (Flake8/Black)
        run: |
          pip install black flake8
          black --check backend/
          flake8 backend/

      - name: Run Tests
        run: |
          export DJANGO_SETTINGS_MODULE=config.settings.test
          python backend/manage.py test

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safety check
        run: |
          pip install safety
          safety check
